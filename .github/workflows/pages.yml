name: Publish tested web commit (manual)

on:
  workflow_dispatch:
    inputs:
      tested_commit_sha:
        description: Full 40-hex commit SHA already tested on main
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate full commit SHA
        env:
          RELEASE_SHA: ${{ inputs.tested_commit_sha }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Supply a full 40-character hexadecimal tested commit SHA.' >&2
            exit 1
          fi
      - name: Check out main history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require main ancestry and select exact source
        env:
          RELEASE_SHA: ${{ inputs.tested_commit_sha }}
        shell: bash
        run: |
          RELEASE_SHA="${RELEASE_SHA,,}"
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "Building tested source: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/release-manifest.check.mjs
      - name: Build for project Pages path
        run: npm run build -- --base /omnibox-ai/
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
